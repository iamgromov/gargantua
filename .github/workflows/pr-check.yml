name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check-title:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: ${TITLE}"

          if echo "${TITLE}" | grep -qE '^(feat|fix|refactor|test|chore|revert|ci)(\(.+\))?!?: .+'; then
            echo "✅ PR title follows Conventional Commits"
          else
            echo "⛔ ERROR: PR title must follow Conventional Commits format:"
            echo "  type(scope): description"
            echo ""
            echo "Allowed types: feat, fix, refactor, test, chore, revert, ci"
            echo "Examples:"
            echo "  feat: add new component"
            echo "  fix(button): correct hover state"
            echo "  chore: update dependencies"
            exit 1
          fi
