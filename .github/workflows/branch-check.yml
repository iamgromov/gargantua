name: Branch & PR Rules Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-branch-naming:
    name: Validate feature branch naming
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch name
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${{ github.base_ref }}"

          # If the source branch starts with 'feature/', it must follow the pattern 'feature/*'
          if [[ "${SOURCE_BRANCH}" == feature/* ]]; then
            echo "✅ Feature branch naming is valid: ${SOURCE_BRANCH}"
          else
            echo "⛔ ERROR: Branch '${SOURCE_BRANCH}' does not follow the naming convention."
            echo "Feature branches must be named 'feature/*' (e.g., feature/my-feature)."
            exit 1
          fi

  check-pr-target:
    name: Validate PR target for feature branches
    runs-on: ubuntu-latest
    steps:
      - name: Check target branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${TARGET_BRANCH}"

          # Feature branches can only target 'dev' or 'main'
          if [[ "${SOURCE_BRANCH}" == feature/* ]]; then
            if [[ "${TARGET_BRANCH}" == "dev" || "${TARGET_BRANCH}" == "main" ]]; then
              echo "✅ PR target '${TARGET_BRANCH}' is valid for feature branch."
            else
              echo "⛔ ERROR: Feature branch '${SOURCE_BRANCH}' targets '${TARGET_BRANCH}'."
              echo "Feature branches must be merged into 'dev' or 'main' only."
              exit 1
            fi
          else
            echo "⏭️ Skipping target check: '${SOURCE_BRANCH}' is not a feature branch."
          fi
